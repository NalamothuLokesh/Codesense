<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 660" width="860" height="660">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <!-- Sharp, high-visibility dark arrowhead -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <style>
    .header-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
    .box-title { font-family: Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #0f172a; }
    .box-sub { font-family: Arial, sans-serif; font-size: 10px; font-weight: normal; fill: #334155; }
    .flow-tag { font-family: Arial, sans-serif; font-size: 8.5px; font-weight: bold; fill: #475569; letter-spacing: 0.3px; }
    .caption { font-family: Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- ======================================================== -->
  <!-- 1. OUTER FRAME                                           -->
  <!-- ======================================================== -->
  <rect x="20" y="20" width="820" height="585" rx="8" fill="#fafafa" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="20" width="820" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="40" y="44" class="header-title">Data Flow in the System — CodeSense Platform</text>

  <!-- ======================================================== -->
  <!-- 2. DATA PROCESSING BOXES (Uniform styling across all 6)  -->
  <!-- ======================================================== -->

  <!-- Stage 1: Repository Intake & Sandbox -->
  <rect x="80" y="75" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="97" text-anchor="middle" class="box-title">1. Target Repository Intake and Ephemeral Sandboxing</text>
  <text x="430" y="115" text-anchor="middle" class="box-sub">Clones Git repo/path into isolated sandbox; prunes 25+ non-source boilerplate categories</text>

  <!-- Stage 2: Deterministic Static Heuristic Pre-Scanning -->
  <rect x="80" y="159" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="181" text-anchor="middle" class="box-title">2. Deterministic Static Heuristic Pre-Scanning</text>
  <text x="430" y="199" text-anchor="middle" class="box-sub">Scans source files with compiled regex to detect verified secrets, CORS, and SSL vulnerabilities</text>

  <!-- Stage 3: Semantic Context Priority Scheduling -->
  <rect x="80" y="243" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="265" text-anchor="middle" class="box-title">3. Semantic Context Priority Scheduling and Token Budgeting</text>
  <text x="430" y="283" text-anchor="middle" class="box-sub">Prioritizes manifests, entry points, schemas, and routes under strict 40k-char token budgets</text>

  <!-- Stage 4: Four-Stage Sequential LLM Review Orchestration -->
  <rect x="80" y="327" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="349" text-anchor="middle" class="box-title">4. Four-Stage Sequential LLM Review Orchestration</text>
  <text x="430" y="367" text-anchor="middle" class="box-sub">Executes 4 sequential Gemini calls (P1–P4) to synthesize 12-section technical review document</text>

  <!-- Stage 5: Multi-Store Persistence and Interactive RAG Indexing -->
  <rect x="80" y="411" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="433" text-anchor="middle" class="box-title">5. Multi-Store Persistence and Interactive RAG Indexing</text>
  <text x="430" y="451" text-anchor="middle" class="box-sub">Commits specification to MongoDB Atlas and embeds 600-char chunks into ChromaDB vector store</text>

  <!-- Stage 6: Final Output Delivery and Dashboard Consumption (End Point / Sink) -->
  <rect x="80" y="495" width="700" height="56" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
  <text x="430" y="517" text-anchor="middle" class="box-title">6. Final Output Delivery and Dashboard Consumption (End Point / Sink)</text>
  <text x="430" y="535" text-anchor="middle" class="box-sub">Renders 12-section review, health scorecard, dynamic Mermaid flowcharts, and live RAG chat</text>


  <!-- ======================================================== -->
  <!-- 3. CONNECTORS & ARROWHEADS (Rendered ON TOP)             -->
  <!-- ======================================================== -->

  <!-- Connector 1 -> 2 -->
  <line x1="430" y1="131" x2="430" y2="157" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="335" y="136" width="190" height="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
  <text x="430" y="147" text-anchor="middle" class="flow-tag">Filtered Clean Source AST</text>

  <!-- Connector 2 -> 3 -->
  <line x1="430" y1="215" x2="430" y2="241" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="330" y="220" width="200" height="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
  <text x="430" y="231" text-anchor="middle" class="flow-tag">Empirical Security Anomaly Signals</text>

  <!-- Connector 3 -> 4 -->
  <line x1="430" y1="299" x2="430" y2="325" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="335" y="304" width="190" height="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
  <text x="430" y="315" text-anchor="middle" class="flow-tag">Packed High-Density Context</text>

  <!-- Connector 4 -> 5 -->
  <line x1="430" y1="383" x2="430" y2="409" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="330" y="388" width="200" height="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
  <text x="430" y="399" text-anchor="middle" class="flow-tag">12-Section Specification Document</text>

  <!-- Connector 5 -> 6 -->
  <line x1="430" y1="467" x2="430" y2="493" stroke="#0f172a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="315" y="472" width="230" height="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" rx="2"/>
  <text x="430" y="483" text-anchor="middle" class="flow-tag">Delivers Reports, Flowcharts &amp; Embeddings</text>


  <!-- ======================================================== -->
  <!-- 4. CAPTION                                               -->
  <!-- ======================================================== -->
  <text x="430" y="635" text-anchor="middle" class="caption">Fig 4.2 Data flow diagram of CodeSense repository ingestion, review synthesis, and output delivery</text>

</svg>
