<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <style>
    .header-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #0f172a; }
    .box-title { font-family: Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
    .box-sub { font-family: Arial, sans-serif; font-size: 9.5px; fill: #475569; }
    .msg-label { font-family: Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #0f172a; }
    .caption { font-family: Arial, sans-serif; font-size: 13.5px; font-weight: bold; fill: #0f172a; }
  </style>

  <!-- Outer Frame -->
  <rect x="20" y="20" width="920" height="575" rx="8" fill="#fafafa" stroke="#334155" stroke-width="2"/>
  <rect x="20" y="20" width="920" height="38" rx="8" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="40" y="44" class="header-title">Sequence Diagram — CodeSense Operational Workflow</text>

  <!-- ========================================== -->
  <!-- LIFELINES & PARTICIPANT BOXES              -->
  <!-- ========================================== -->

  <!-- 1. Developer -->
  <rect x="40" y="72" width="130" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="105" y="89" text-anchor="middle" class="box-title">Developer</text>
  <text x="105" y="103" text-anchor="middle" class="box-sub">Client User</text>
  <line x1="105" y1="114" x2="105" y2="570" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- 2. Presentation Layer -->
  <rect x="215" y="72" width="145" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="287" y="89" text-anchor="middle" class="box-title">Presentation Layer</text>
  <text x="287" y="103" text-anchor="middle" class="box-sub">React 19 SPA (Vite)</text>
  <line x1="287" y1="114" x2="287" y2="570" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- 3. API Gateway -->
  <rect x="405" y="72" width="145" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="477" y="89" text-anchor="middle" class="box-title">API Gateway</text>
  <text x="477" y="103" text-anchor="middle" class="box-sub">Node.js Express (:4000)</text>
  <line x1="477" y1="114" x2="477" y2="570" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- 4. AI Review Engine -->
  <rect x="595" y="72" width="145" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="667" y="89" text-anchor="middle" class="box-title">AI Review Engine</text>
  <text x="667" y="103" text-anchor="middle" class="box-sub">Python 3.11 Subprocess</text>
  <line x1="667" y1="114" x2="667" y2="570" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- 5. Data & AI Services -->
  <rect x="785" y="72" width="135" height="42" rx="6" fill="#ffffff" stroke="#1e293b" stroke-width="1.6"/>
  <text x="852" y="89" text-anchor="middle" class="box-title">Data &amp; AI Cloud</text>
  <text x="852" y="103" text-anchor="middle" class="box-sub">Mongo, Chroma, Gemini</text>
  <line x1="852" y1="114" x2="852" y2="570" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- ========================================== -->
  <!-- INTERACTIONS & MESSAGES                    -->
  <!-- ========================================== -->

  <!-- 1. Dev -> React: submit repository -->
  <line x1="105" y1="138" x2="287" y2="138" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="196" y="132" text-anchor="middle" class="msg-label">1: submit repository (URL / local path)</text>

  <!-- 2. React -> Gateway: POST /api/review -->
  <line x1="287" y1="172" x2="477" y2="172" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="382" y="166" text-anchor="middle" class="msg-label">2: POST /api/review/start (JWT token)</text>

  <!-- 3. Gateway -> Review Engine: spawn -->
  <line x1="477" y1="206" x2="667" y2="206" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="572" y="200" text-anchor="middle" class="msg-label">3: spawn(generate_review_doc.py, jobId)</text>

  <!-- 4. Review Engine: self call (sandbox & static scan) -->
  <path d="M 667 236 L 700 236 L 700 258 L 667 258" fill="none" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="705" y="250" text-anchor="start" class="msg-label">4: clone sandbox &amp; static heuristic scan</text>

  <!-- 5. Review Engine -> Data & AI: sequential LLM calls -->
  <line x1="667" y1="288" x2="852" y2="288" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="759" y="282" text-anchor="middle" class="msg-label">5: 4-stage sequential prompts (P1–P4)</text>

  <!-- 6. Data & AI -> Review Engine: return sections -->
  <line x1="852" y1="322" x2="667" y2="322" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="759" y="316" text-anchor="middle" class="msg-label">6: return 12-section technical specification</text>

  <!-- 7. Review Engine -> Data & AI: persist & index ChromaDB -->
  <line x1="667" y1="358" x2="852" y2="358" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="759" y="352" text-anchor="middle" class="msg-label">7: commit to MongoDB &amp; index ChromaDB</text>

  <!-- 8. Review Engine -> Gateway: notify complete -->
  <line x1="667" y1="394" x2="477" y2="394" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="572" y="388" text-anchor="middle" class="msg-label">8: job completed (healthScore = 8.5/10)</text>

  <!-- 9. React -> Gateway: poll status -->
  <line x1="287" y1="430" x2="477" y2="430" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="382" y="424" text-anchor="middle" class="msg-label">9: GET /api/review/status/:jobId (Poll)</text>

  <!-- 10. Gateway -> React: return report -->
  <line x1="477" y1="464" x2="287" y2="464" stroke="#0f172a" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="382" y="458" text-anchor="middle" class="msg-label">10: return review report &amp; health scorecard</text>

  <!-- 11. React -> Dev: render view -->
  <line x1="287" y1="500" x2="105" y2="500" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="196" y="494" text-anchor="middle" class="msg-label">11: render dashboard, Mermaid &amp; RAG UI</text>

  <!-- 12. Dev -> Data & AI: interactive query -->
  <line x1="105" y1="538" x2="852" y2="538" stroke="#0f172a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="478" y="532" text-anchor="middle" class="msg-label">12: query RAG assistant (natural language) -> stream top-K source citations</text>

  <!-- Caption -->
  <text x="480" y="622" text-anchor="middle" class="caption">Fig 4.6 Sequence Diagram</text>
</svg>